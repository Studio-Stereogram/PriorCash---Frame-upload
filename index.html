<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PriorCash Mooncake Frames</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f8fb;
        color: #111827;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 48px 20px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 30px;
        line-height: 1.15;
      }

      p {
        margin: 0 0 16px;
        color: #4b5563;
        line-height: 1.55;
      }

      .panel {
        margin-top: 24px;
        padding: 18px;
        border: 1px solid #dbe3ef;
        border-radius: 8px;
        background: #fff;
      }

      code,
      textarea {
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      code {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 5px;
        background: #eef2f7;
        color: #1f2937;
      }

      textarea {
        width: 100%;
        min-height: 220px;
        box-sizing: border-box;
        margin-top: 12px;
        padding: 12px;
        resize: vertical;
        border: 1px solid #d1d9e6;
        border-radius: 8px;
        color: #172033;
        background: #fbfdff;
      }

      button {
        min-height: 40px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        background: #0614f4;
        font-weight: 650;
        cursor: pointer;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-top: 14px;
      }

      .muted {
        color: #6b7280;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PriorCash Mooncake Frames</h1>
      <p>Static GitHub Pages asset host for the ordered Mooncake WebP frame sequence.</p>
      <p>Manifest: <a href="./manifest.json"><code>manifest.json</code></a></p>

      <section class="panel">
        <p><strong>Frame URL base</strong></p>
        <code id="base-url"></code>
        <div class="row">
          <button id="copy">Copy URL list</button>
          <span class="muted" id="status">146 frames, filename sorted.</span>
        </div>
        <textarea id="urls" readonly></textarea>
      </section>
    </main>

    <script>
      async function init() {
        const manifest = await fetch("./manifest.json").then((response) => response.json())
        const base = new URL("./", window.location.href).href
        const urls = manifest.frames.map((frame) => new URL(frame.path.replace(/^\//, ""), base).href)

        document.getElementById("base-url").textContent = base
        document.getElementById("urls").value = urls.join("\n")
        document.getElementById("copy").addEventListener("click", async () => {
          await navigator.clipboard.writeText(urls.join("\n"))
          document.getElementById("status").textContent = "Copied 146 frame URLs."
        })
      }

      init()
    </script>
  </body>
</html>
